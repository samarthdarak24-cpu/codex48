version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: precedent-postgres
    environment:
      POSTGRES_USER: precedent
      POSTGRES_PASSWORD: precedent_password
      POSTGRES_DB: precedent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precedent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: precedent-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://precedent:precedent_password@postgres:5432/precedent
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JOBS_INLINE: "false"
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: precedent-worker
    command: python -m app.workers.worker
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://precedent:precedent_password@postgres:5432/precedent
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: precedent-scheduler
    command: python -m app.workers.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://precedent:precedent_password@postgres:5432/precedent
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      SENTINEL_CRON: "0 0 * * *"
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: precedent-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://127.0.0.1:8000
    depends_on:
      - api

volumes:
  pgdata:

