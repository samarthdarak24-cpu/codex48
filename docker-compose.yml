# Precedent — local single-origin run.
#
#   docker compose build
#   docker compose run --rm app python backend/seed.py   # one-off, clears data
#   docker compose up
#   open http://localhost:8000
#
# The seed step is separate on purpose: it resets the database, so it must
# never run automatically on every restart.

services:
  app:
    build: .
    image: precedent:local
    ports:
      - "8000:8000"
    environment:
      # SQLite on a named volume so data survives `docker compose down`.
      DATABASE_URL: "sqlite:////data/precedent.db"
      UPLOADS_DIR: "/app/backend/uploads"
      TESSERACT_CMD: "/usr/bin/tesseract"
      OCR_LANGS: "eng"
      PYTHONPATH: "/app/backend"
      CORS_ORIGINS: "http://localhost:8000"
      # Optional AI. Leave empty to run deterministic-only (the default).
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: "gpt-4o-mini"
    volumes:
      - precedent-data:/data
      - precedent-uploads:/app/backend/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional PostgreSQL path. Uncomment this service and switch DATABASE_URL
  # on `app` to:
  #   DATABASE_URL: "postgresql+psycopg://precedent:precedent@db:5432/precedent"
  # then run `docker compose run --rm app alembic upgrade head` once.
  #
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: precedent
  #     POSTGRES_PASSWORD: precedent
  #     POSTGRES_DB: precedent
  #   volumes:
  #     - precedent-pg:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U precedent"]
  #     interval: 10s
  #     retries: 5

volumes:
  precedent-data:
  precedent-uploads:
  # precedent-pg:
